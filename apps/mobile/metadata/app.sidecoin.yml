# apps/mobile/metadata/app.sidecoin.yml
#
# F-Droid metadata draft for the Sidecoin mobile wallet.
#
# STATUS: DRAFT — not yet submitted. Kept in-repo so the recipe stays in sync
# with the actual build (versionCode, flavor, and the FOSS-only guarantee).
#
# WHY NOT `fdroid/fdroiddata` YET:
#   The recipe is only meaningful once the build has been proven to contain
#   ZERO proprietary dependencies. That proof now exists for the `fdroid`
#   flavor: the release APK's classes.dex carries no com.google.android.gms,
#   com.google.mlkit, com.google.firebase, or androidx.credentials.playservices
#   classes (verified with dexdump against the assembled APK). react-native-
#   vision-camera (MLKit-bound) and react-native-passkey (play-services-
#   credentials) were both removed; QR scanning is now our own CameraX + ZXing
#   implementation.
#
# Before submitting, confirm:
#   1. `pnpm install` is up to date and pnpm-lock.yaml is committed.
#   2. `./gradlew :app:assembleFdroidRelease` succeeds from a clean checkout.
#   3. The `commit:` below is a FULL 40-char hash (Build_Metadata_Reference:
#      "Don't use branch name or tag name. The full commit hash should be used.").
#   4. android/app/src/fdroid/play/listings/en-US/graphics/icon/icon.png exists
#      (512x512). F-Droid reads store metadata from the Triple-T layout at
#      src/<flavor>/play/ in the app module (update.py
#      copy_triple_t_store_metadata), not from fastlane/metadata/.
#
# SIGNING — whose key ends up on the shipped APK:
#   The main F-Droid repo re-signs with its own per-app key, but that is NOT
#   mandatory. F-Droid can publish an APK carrying the UPSTREAM developer's
#   signature, honouring our own key. There are two supported routes (both
#   verified against the installed fdroidserver 2.4.4 source, not from memory):
#
#     a) Exclusive upstream signing — add `Binaries:` (or per-build
#        `binary:`) pointing at our hosted APK plus `AllowedAPKSigningKeys:`
#        with our cert's SHA-256. publish.py then compares F-Droid's own build
#        against our binary and, only on a byte match, ships OUR apk. Used by
#        1144 recipes in fdroiddata.
#
#     b) Publish both — commit an extracted `signatures/<vercode>/` directory
#        (`fdroid signatures our.apk`). publish.py implants that signature onto
#        the F-Droid build (common.apk_implant_signatures) and ships it
#        alongside the F-Droid-signed APK.
#
#   BOTH routes are gated on one thing: F-Droid's from-source build must match
#   our APK's contents, because a signature only validates against the exact
#   bytes it was made over. publish.py:436 drops the developer-signed APK when
#   `verify_apk_signature` fails.
#
#   That gate is now PASSED. The build became byte-reproducible in commits
#   d9700ff (redirect __FILE__-derived strings with -ffile-prefix-map on every
#   autolinked CMake target, including :app via its finalizeDsl) and 762805a
#   (drop the content-derived ELF build-id, which -ffile-prefix-map cannot
#   reach because it is seeded from the variable AGP .cxx/<hash>/ directory
#   name). Verified by building the SAME commit from two different absolute
#   paths and comparing:
#     • apksigcopier compare --unsigned   -> exit 0
#     • all 985 zip entries               -> byte-identical
#     • all 100 lib/*.so across 4 ABIs    -> byte-identical
#     • no leaked /Workspace, /home, /tmp build paths in any .so
#   and then running F-Droid's own publish check (apksigcopier copy of our
#   signature onto the other build + apksigner verify) -> exit 0, cert
#   SHA-256 42126930dd049c558fcebc7f5893fa83cba0021a24aafe447e4dc6b3452d65d4.
#
#   Route (a) additionally needs a HOSTED binary at `Binaries:`/`binary:` for
#   publish.py to fetch and compare. The signed release APK is attached to the
#   v26.9.30 GitHub release (asset app-fdroid-release.apk, 74,521,086 bytes,
#   SHA-256 b9f22fb5102b4fc5e7194059fa7459ab63b1b90f5d4380931928ce743786d983),
#   so `Binaries:` below resolves to it via %v -> versionName. If verification
#   ever fails, publish is SKIPPED (publish.py counts it as failed), not
#   silently re-signed, so an upstream mismatch can never ship a wrong APK.
#
#   NOTE: `Binaries:` uses %v -> versionName, so it currently resolves to the
#   v26.9.30 release, which must be tagged and uploaded before submission.
#
#   The binary is REBUILT at commit ecf636e (was 362709c at 26.9.29).
#   26.9.30 carries two changes on top of the 26.9.29 chain:
#     • ARM-only release APKs — reactNativeArchitectures was left at the AGP
#       default (all four ABIs), so the APK shipped x86 + x86_64 libraries
#       that exist only for emulators (x86_64 37.0 MB + x86 35.4 MB = 72.4 MB).
#       Pinning it to arm64-v8a,armeabi-v7a takes the APK from 148,163,537 to
#       74,521,086 bytes (-49.7%) with no loss of device coverage. Precedent:
#       ch.swissbitcoinpay.checkout.yml sets the same property.
#     • The history store moved from react-native-sqlite-storage (prebuilt
#       .so, scanignored) to @op-engineering/op-sqlite, which compiles the
#       SQLite amalgamation (cpp/sqlite3.c) from source, so the SQLite
#       scanignore entry is gone.
#   The 26.9.29 chain remains in place below it: 362709c drops the AGP-written
#   `Dependency metadata` signing block (id 0x504b4453) that F-Droid's
#   `check apk` scanner rejects outright, sits on top of c8c235d, the version
#   bump to 26.9.29, which in turn sits on 7aa639f, the reproducibility pin
#   described below.
#   Reason 1 (signing block): the first CI `fdroid build` compiled and passed
#   reproducibility, but `check apk` failed with "ERROR Found extra signing
#   block 'Dependency metadata' in ...binary.apk". AGP 7.0+ writes it from
#   `android.dependenciesInfo`; it is read only by Play Console tooling, so it
#   is disabled in the source app/build.gradle (precedent: com.wire and
#   org.therapiefinder append the same stanza). Removing it shrinks the APK by
#   the block's 8192 bytes, hence the new size and hash above.
#   Reason: the first CI `fdroid build` compiled green and then failed the
#   reproducibility check with exactly one differing file, resources.arsc.
#   Its string pool held the same 7373 strings on both sides; the only value
#   that differed was `react_native_dev_server_ip`, which the React Native
#   Gradle plugin fills with the BUILDING MACHINE's first non-loopback IPv4
#   (AgpConfiguratorUtils.getHostIpAddress): 10.141.60.188 on our workstation,
#   172.17.0.3 on F-Droid's buildserver. Commit 7aa639f pins that resource to
#   `localhost` from a finalizeDsl callback on :app, so every machine bakes the
#   same bytes. Rebuilt and re-uploaded; the recipe now points at that commit.
#
# VERSIONING — versionCode is 8-digit YYYYMMDD (e.g. 2026-09-23 -> 20260923).
# Android and F-Droid require versionCode to INCREASE with every release. A
# date is monotonically increasing across day, month, and year boundaries, so
# this scheme holds — but ONLY if each release carries the date it ships on.
# The one way to break it is shipping twice in a day: both builds would carry
# the same versionCode and the store would reject the second. If that happens,
# bump to the next day, or append a same-day counter (2026092301, ...). The
# field is an int32, so a 10-digit value still fits (max 2147483647).
#
# This is the FIRST published release. Earlier build.gradle values
# (26050011, 26050030) were local-only: no tag, no GitHub release, and no
# distribution, so there is no published version for this one to exceed.

Categories:
  - Security
  - Wallet

License: MIT

AuthorName: APECS contributors

SourceCode: https://github.com/APECSdev/sidecoin

IssueTracker: https://github.com/APECSdev/sidecoin/issues

# WebSite / Donate omitted deliberately: no verified public project page yet.

AutoName: Sidecoin

# The app is a pnpm workspace member. F-Droid builds from the repo root so the
# workspace symlinks (@sidecoin/shared, @sidecoin/api-client) resolve.
RepoType: git
Repo: https://github.com/APECSdev/sidecoin.git

# Hosted reference binary: the APK we signed with our own release key, from the
# SAME commit as the build below, so publish.py (route (a)) can verify F-Droid's
# source build byte-for-byte against it and then SHIP OURS. %v resolves to
# versionName (26.9.30), matching the v26.9.30 tag/release. GitHub returns a 302
# redirect to the asset; fdroidserver's net.download_file follows it (verified:
# HTTP 200, content-length 74521086).
Binaries: 
  https://github.com/APECSdev/sidecoin/releases/download/v%v/app-fdroid-release.apk

Builds:
  # versionCode / versionName MUST match apps/mobile/android/app/build.gradle.
  # If this drifts, F-Droid will build a different APK than the one tested.
  - versionName: 26.9.30
    versionCode: 20260930
    # FULL 40-char hash, not the v26.9.30 tag. Build_Metadata_Reference:
    # "Don't use branch name or tag name. The full commit hash should be used."
    # This is the first commit whose native libraries are byte-reproducible
    # (see the SIGNING note above); earlier commits embed absolute build paths
    # and the build-machine IP in resources.arsc (see the SIGNING note).
    commit: ecf636edc525efe7e6590914d5d2cafcba7ad187
    # `subdir` is the MODULE directory, not the Gradle project root. fdroidserver
    # roots both the gradle invocation (build.py) and the APK search at
    # `root_dir = build_dir/subdir` (common.prepare_source), and its default
    # gradle output method globs `<root_dir>/build/outputs/apk/<flavor>/release`.
    # A React Native `app` module writes exactly there, so pointing `subdir` at
    # `app` lets the default glob find the APK and removes the need for an
    # `output:` line. (The gradle *task* still builds the multi-module project:
    # fdroidserver runs the system `gradle` binary, which walks up to
    # `apps/mobile/android/settings.gradle`, rather than `./gradlew`.)
    # The old `subdir: apps/mobile/android` + explicit `output:` failed with
    # "Failed to find any output apks", because the module's output sits one
    # level below the directory fdroidserver was searching.
    subdir: apps/mobile/android/app
    # `fdroid` is the FOSS flavor: it excludes the playstore-only Sentry
    # dependency (see android/app/build.gradle `playstoreImplementation`).
    gradle:
      - fdroid
    # The buildserver VM runs Debian trixie, which no longer ships a JDK 17.
    # Gradle needs one anyway: the React Native Gradle plugin forks a JVM with
    # `languageVersion=17`, and without a matching toolchain the build dies with
    #
    #   Cannot find a Java installation on your machine matching:
    #   {languageVersion=17, vendor=any vendor}.
    #   Toolchain auto-provisioning is not enabled.
    #
    # Installing only openjdk-21 is therefore NOT enough, and openjdk-17 from
    # the default trixie sources does not exist (`E: Unable to locate package
    # openjdk-17-jdk-headless`). Pull it from bookworm instead — the exact
    # approach the merged React Native recipe dev.djara.wafrn_rn takes on the
    # same trixie buildserver.
    #
    # Three things are provisioned here:
    #
    # 1. JDK 17 from bookworm, selected via update-java-alternatives.
    # 2. Node + npm — not in the image. Installed from Debian forky (testing)
    #    rather than the upstream nodejs.org tarball: F-Droid's buildserver has
    #    no `node` and no `npm`, and pulling both from the distro keeps the
    #    provisioning to plain apt. forky nodejs is 24.21.0, which satisfies
    #    the repo's `engines.node` (>= 22 at the root, >= 20 in apps/mobile).
    #    (No version pin: forky tracks testing and will roll forward.)
    # 3. pnpm — pinned to the exact version in the repo's root `packageManager`
    #    (pnpm@9.15.4) and installed with `npm install -g`, in this sudo block.
    #    `corepack enable` does NOT work here: fdroidserver runs `init:` as an
    #    unprivileged user and Debian's corepack tries to write its shims to
    #    `/usr/bin` (`EACCES: permission denied, symlink … ->
    #    '/usr/bin/pnpm'`). `npm install -g` runs as root in `sudo:` and lands
    #    pnpm on PATH without touching /usr/bin. Same approach as
    #    de.volksverpetzer.app.yml (`apt-get install -y -t forky npm` +
    #    `npm install -g pnpm@<version>`).
    #
    # The install runs in `init:`, which fdroidserver executes in
    # prepare_source() immediately after checkout — BEFORE `rm:`/`prebuild:` and,
    # crucially, before the source scanner. That ordering is what makes
    # `scandelete: node_modules` safe: the scanner still sees every installed
    # module, but init has already produced the tree Gradle needs.
    #
    # `init:` runs with cwd = root_dir = build_dir/subdir, i.e. now inside
    # `apps/mobile/android/app`, so its `cd` targets are shifted one level
    # deeper than when subdir was `apps/mobile/android`. `cd ../../../..`
    # climbs app -> android -> mobile -> apps -> repo root, and the last line
    # returns to the module dir where gradle is invoked.
    # CI=true is REQUIRED, not cosmetic. apps/desktop declares a postinstall
    # that runs `cargo run --bin export_types` (a Tauri type-export) unless CI
    # is exactly "true". Without it, a clean install spends ~13m compiling Rust
    # and needs a toolchain the build server may not have. With it, install
    # drops to ~30s with zero cargo invocations.
    sudo:
      - apt-get update
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@9.15.4
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    init:
      - cd ../../../..
      - CI=true pnpm install --frozen-lockfile
      - cd apps/mobile/android/app
    ndk: 27.1.12297006
    # node_modules is created by the `init:` `pnpm install`, so it cannot be
    # named in `rm:` — fdroidserver applies `rm:` AFTER `init:` and hard-fails
    # on a glob that matches nothing (`getpaths_map`, common.py). The checkout's
    # `git clean -dffx` already yields a pristine tree; scandelete covers the
    # nonfree-source scan of the installed modules.
    scandelete:
      - node_modules
    # Some React Native modules declare a LOCAL maven repo with a Gradle
    # expression (`url "$rootDir/../node_modules/react-native/android"`,
    # `url "${reactNativeRootDir}/android"`, ...). fdroidserver's scanner treats
    # any maven url matching MAVEN_URL_REGEX that is not a known remote as an
    # "unknown maven repo" (scanner.py), and because `scandelete: node_modules`
    # also matches these paths it DELETES the whole build.gradle. Autolinking
    # then fails at settings.gradle (`autolinkLibrariesFromCommand` -> the RN
    # CLI can no longer read the module's namespace), aborting the build.
    # `scanignore` is checked BEFORE scandelete in `handleproblem`, so listing
    # these files keeps them in the tree while suppressing the false positive.
    # Glob the pnpm content-hash so the entries survive dependency updates.
    scanignore:
      - node_modules/.pnpm/@react-native-async-storage+async-storage@*/node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/.pnpm/react-native-safe-area-context@*/node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/.pnpm/react-native-screens@*/node_modules/react-native-screens/android/build.gradle
      - node_modules/.pnpm/react-native-svg@*/node_modules/react-native-svg/android/build.gradle
      - node_modules/.pnpm/react-native-vector-icons@*/node_modules/react-native-vector-icons/android/build.gradle
      - node_modules/.pnpm/react-native-webview@*/node_modules/react-native-webview/android/build.gradle
      - node_modules/.pnpm/react-native@*/node_modules/react-native/ReactAndroid/publish.gradle
      # ── Build-critical binaries the scanner would otherwise DELETE ────────
      # `scandelete: node_modules` makes the scanner delete every flagged path
      # under node_modules. Three of those deletions break the from-source build
      # (found by running the real `fdroid build`; see /tmp/fdroid-build3.log):
      #
      # 1. HERMESC — react-native/sdks/hermesc/<abi>-bin/hermesc is the
      #    Hermes bytecode compiler. The Gradle task
      #    createBundle<Flavor><BuildType>JsAndAssets shells out to it to turn
      #    the JS bundle into .hbc; with the binary deleted the task fails with
      #    "Couldn't determine Hermesc location".
      # 2. SKIA STATIC LIBS — @shopify/react-native-skia ships ONLY prebuilt
      #    libs/android/<abi>/*.a (no externals/skia checkout; its
      #    CMakeLists.txt imports libskia.a etc. as IMPORTED STATIC targets).
      #    Deleting them makes :shopify-react-native-skia:buildCMake*
      #    [arm64-v8a] fail on the missing libsvg.a. The package's only script
      #    (install-skia.mjs) re-downloads the SAME prebuilt tarball, so
      #    scanignoring them is the minimum change; building Skia from source
      #    would need an `srclib` + build-skia.ts, which the published package
      #    does not contain.
      #
      # There is deliberately NO SQLite entry. The wallet's history store uses
      # @op-engineering/op-sqlite, which compiles the SQLite amalgamation
      # (cpp/sqlite3.c) from source and, with its default configuration, sets
      # `jniLibs.srcDirs = []` in android/build.gradle so no prebuilt native
      # library is packaged at all. Its unused libsql/turso/sqlite-vec blobs
      # are covered by `scandelete: node_modules`, and deleting them is safe
      # because Gradle never reads those directories.
      - node_modules/.pnpm/react-native@*/node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/.pnpm/@shopify+react-native-skia@*/node_modules/@shopify/react-native-skia/libs/android

# The ONLY signer allowed to have produced the shipped APK. If an APK in the
# repo carries any other signature, fdroid update drops it (update.py
# get_apks_without_allowed_signatures). This is our release key's X.509 SHA-256:
#   apksigner verify --print-certs app-fdroid-release.apk
#   V2 Signer: certificate SHA-256 digest:
#   42126930dd049c558fcebc7f5893fa83cba0021a24aafe447e4dc6b3452d65d4
#   Subject: CN=APECS Dev, OU=Administration, O=APECSdev, L=Atlanta,
#            ST=Georgia, C=US   (RSA 4096, valid 2026-09-22 .. 2054-02-07)
# Field must match ^[a-fA-F0-9]{64}$ (metadata.py FieldValidator); lowercase to
# match the canonical form fdroidserver stores.
AllowedAPKSigningKeys: 
  42126930dd049c558fcebc7f5893fa83cba0021a24aafe447e4dc6b3452d65d4

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 26.9.30
CurrentVersionCode: 20260930

# NonFreeNet: the wallet talks to third-party hosted services that are not
# free software and cannot be self-hosted by the user from within the app:
#   • https://sidecoin.app/v1        (Sidecoin adapter)
#   • https://esplora.beta.ecash.ninja   (Betanet block explorer / API)
#   • https://esplora.signet.drivechain.info (Signet block explorer / API)
#   • https://ecashfarm.com/v1       (ECX market price)
#   • https://supaqt.com/v1          (SupaQt Coin News feeds)
# This is an anti-feature, not a blocker. The reason is carried in the
# localized-string form below so linsui's "Add the reasons." request is met.
AntiFeatures:
  NonFreeNet:
    en-US: Talks to hosted sidecoin.app, Esplora, eCash Farm and SupaQt services
