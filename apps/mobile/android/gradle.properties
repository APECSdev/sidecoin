# packages/mobile/android/gradle.properties

# Project-wide Gradle settings.

# VM Options
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true

# Hermes JS engine — enabled by default in RN 0.81
hermesEnabled=true

# New Architecture — required by react-native-reanimated 4.x and react-native-worklets 0.6.x
newArchEnabled=true

# Enable parallel builds
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# ABIs packaged into the release APK. Only 32-bit and 64-bit ARM are built:
# every real Android phone is one of these two, so the x86 and x86_64 images
# (which exist only for emulators) were ~72 MB of dead weight in a ~148 MB
# APK. The React Native Gradle plugin reads this as a comma-separated list
# (ProjectUtils.getReactNativeArchitectures splits on ","), and with the
# property absent it returns an EMPTY list, which means no abiFilters at all
# and all four ABIs packaged. F-Droid ships one universal APK per version, so
# ABI splits are not an option here — both ARM ABIs stay in this single APK.
reactNativeArchitectures=arm64-v8a,armeabi-v7a
