// apps/mobile/android/app/build.gradle

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration — controls Hermes, autolinking, etc.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * react-native-vector-icons font assets.
 *
 * WITHOUT THIS the tab bar renders every glyph as a missing-glyph box
 * (the "X" the user saw): react-native-vector-icons ships the icon
 * typefaces as .ttf assets and relies on this Gradle script to copy them
 * into the APK. Autolinking wires up the native module but NOT the fonts.
 *
 * Only the sets this app actually imports are bundled — MaterialIcons is
 * used by the bottom tab bar in src/navigation/RootNavigator.tsx, and
 * Ionicons is declared by the shell tests. Adding every *.ttf would cost
 * ~1 MB of APK for unused glyph sets.
 */
project.ext.vectoricons = [
    iconFontNames: [ "MaterialIcons.ttf", "Ionicons.ttf" ]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * Set this to true to run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Load the signing config from local keystore.properties if present.
 * For F-Droid builds, signing is handled by the F-Droid build server.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ─── Reproducible builds: strip machine-specific paths from native libs ─────
//
// :app compiles React Native's generated codegen libraries plus appmodules, and
// those objects embed absolute source paths through __FILE__ — either the
// monorepo checkout path or the Gradle cache path under the build user's home.
// Those paths differ per machine, so two builds of the same commit produce
// different .so bytes, a different APK, and a hash F-Droid cannot match against
// its own build. That mismatch is what blocks publishing an APK signed with our
// own key.
//
// The mappings themselves are defined once in the root build.gradle as
// ext.reproCmakeFlags (see the long comment there), together with the autolinked
// library coverage. For :app they must be applied from finalizeDsl rather than
// from the root script: ReactPlugin registers its own finalizeDsl callback to
// configure the new-architecture native build, and AGP runs those callbacks
// after the android {} block has been evaluated — so anything set earlier is
// discarded. androidComponents {} is declared after the com.facebook.react
// plugin is applied at the top of this file, which makes this callback run last.
// Verified: the mappings appear 130 times in the generated build.ninja per ABI.
androidComponents {
    finalizeDsl { ext ->
        ext.defaultConfig.externalNativeBuild.cmake.cppFlags(*rootProject.ext.reproCmakeFlags)
        ext.defaultConfig.externalNativeBuild.cmake.cFlags(*rootProject.ext.reproCmakeFlags)
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "app.sidecoin"

    defaultConfig {
        applicationId "app.sidecoin"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20260923
        versionName "26.9.23"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Our own release key (keystore.properties is gitignored). F-Droid
        // rebuilds from source with its own key; this config is for the APKs
        // we sign and host ourselves.
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    /**
     * Distribution flavors:
     *   - fdroid:    Clean FOSS build, no proprietary SDKs (Sentry, etc.)
     *   - playstore: Full build with Sentry crash reporting + analytics
     */
    flavorDimensions "distribution"
    productFlavors {
        fdroid {
            dimension "distribution"
        }
        playstore {
            dimension "distribution"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Attach our release signer ONLY when keystore.properties exists.
            //
            // F-Droid rebuilds from source and signs with ITS OWN key, so a
            // clean checkout must build with no keystore present. Both
            // keystore.properties and app/debug.keystore are gitignored, so a
            // fresh clone has NEITHER — and the previous fallback to
            // signingConfigs.debug pointed at the missing debug.keystore,
            // failing :app:validateSigningFdroidRelease. Leaving the config
            // null makes Gradle emit `*-unsigned.apk` instead, which is what
            // a from-source builder wants. Our own hosts still get a signed
            // APK because we keep keystore.properties locally.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Sentry — playstore builds only (excluded from F-Droid)
    playstoreImplementation 'io.sentry:sentry-android:7.14.0'

    // ─── FOSS QR scanner (CameraX + ZXing) ────────────────────────────────
    // Replaces react-native-vision-camera, whose Kotlin core hard-imports
    // Google MLKit (com.google.mlkit.vision.barcode) in CameraSession.kt and
    // CameraView.kt — there is no GMS-free mode, so an F-Droid build cannot
    // use it. Both of these are Apache-2.0 and ship no proprietary code.
    //
    // camera-core         — camera abstraction + lifecycle binding
    // camera-camera2      — the Camera2 backend
    // camera-lifecycle    — LifecycleOwner binding used by bindToLifecycle
    // camera-view         — PreviewView surface
    // zxing core          — pure-Java QR decode (no android dependency)
    def cameraxVersion = "1.4.2"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.zxing:core:3.5.3"
}

/**
 * Once Gradle has evaluated every project, the `installDebug` shorthand
 * would be ambiguous because the `fdroid` and `playstore` product flavors
 * each generate their own install task. Tools like the React Native CLI
 * (`react-native run-android`) still invoke `./gradlew installDebug`,
 * so we register a non-ambiguous alias that forwards to the F-Droid
 * flavor — the default development build. The Play Store flavor can
 * still be installed directly with `./gradlew installPlaystoreDebug`.
 */
gradle.projectsEvaluated {
    def fdroidInstallDebug = tasks.findByName('installFdroidDebug')
    if (fdroidInstallDebug != null && tasks.findByName('installDebug') == null) {
        tasks.register('installDebug') {
            dependsOn fdroidInstallDebug
            description = 'Alias for installFdroidDebug (default development flavor)'
            group = 'install'
        }
    }
}
